# Applies new files in supabase/migrations/ to the Supabase database when they reach main.
# Needs three repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_ID    the project ref (the part before .supabase.co in the project URL)
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
# Without the secrets this workflow does nothing.
name: Database migrations
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - id: cfg
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Supabase secrets are not set — skipping."
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase db push
